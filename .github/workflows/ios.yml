name: iOS validation

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: macos-26
    # iOS 26.5 has a StoreKitTest control-channel regression (notEntitled).
    # Keep the SDK/runtime pair explicit: https://developer.apple.com/forums/thread/826971
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show selected Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          toolchain_version="$(xcodebuild -version | tr '\n' ' ')"
          printf '::notice title=Apple toolchain::%s\n' "$toolchain_version"

      - name: Check deterministic project and property lists
        run: |
          python3 ios/scripts/generate-xcode-project.py --check
          plutil -lint ios/BlackjackStudio.xcodeproj/project.pbxproj
          plutil -lint ios/BlackjackStudio/Resources/Info.plist
          plutil -lint ios/BlackjackStudio/Resources/PrivacyInfo.xcprivacy

      - name: Test local Swift packages
        run: |
          set -euo pipefail
          for package in BlackjackCore TrainingCore StudioCore; do
            swift test --package-path "ios/Packages/$package" --jobs 4
          done

      - name: Select the iOS 26.2 iPhone simulator
        run: |
          set -euo pipefail
          simulator_id="$(python3 - <<'PY'
          import json, subprocess, sys
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          choices = [device for device in devices.get(runtime, [])
                     if device.get('isAvailable') and device.get('name', '').startswith('iPhone')]
          if not choices:
              raise SystemExit('Required iOS 26.2 iPhone simulator is unavailable. Do not silently switch StoreKit tests to another runtime.')
          device = min(choices, key=lambda item: (item['name'] != 'iPhone 17 Pro', item['name']))
          print(f"::notice title=iOS Simulator::{device['name']} — iOS 26.2 ({runtime})", file=sys.stderr)
          print(device['udid'])
          PY
          )"
          printf 'SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Build Release for simulator without signing
        run: |
          set -euo pipefail
          mkdir -p TestResults
          xcodebuild build \
            -project ios/BlackjackStudio.xcodeproj \
            -scheme 'BlackjackStudio Release' \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .derivedData/BlackjackStudio \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee TestResults/release-build.log

      - name: Run native UI tests
        run: |
          set -euo pipefail
          mkdir -p TestResults
          xcodebuild test \
            -project ios/BlackjackStudio.xcodeproj \
            -scheme BlackjackStudio \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .derivedData/BlackjackStudio \
            -resultBundlePath TestResults/BlackjackStudio.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee TestResults/ui-tests.log

      - name: Summarize native diagnostics
        if: always()
        run: |
          mkdir -p TestResults
          if [ -d TestResults/BlackjackStudio.xcresult ]; then
            xcrun xcresulttool get test-results summary \
              --path TestResults/BlackjackStudio.xcresult \
              > TestResults/test-summary.json 2> TestResults/summary-export.log || true
          fi
          python3 ios/scripts/summarize-xcode-results.py TestResults

      - name: Preserve Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7
